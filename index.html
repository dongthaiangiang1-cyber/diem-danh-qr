<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Điểm danh V7.5.1</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f2f6f8;
      color: #17324d;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    .header {
      background: #147c6d;
      color: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .version {
      float: right;
      padding: 7px 13px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 20px;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd8df;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 9px;
      margin-bottom: 15px;
    }

    .status-btn,
    .result-btn,
    .exit-btn {
      padding: 14px 8px;
      border: 1px solid #bfd0d8;
      background: white;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      color: #17324d;
    }

    .status-btn.active,
    .result-btn.active,
    .exit-btn.active {
      background: #168c78;
      color: white;
      border-color: #168c78;
    }

    #studyOptions,
    #exitOptions {
      display: none;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 12px;
      background: #f4f8fa;
      border: 1px solid #e0e8eb;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 12px;
    }

    .exit-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 9px;
      margin-bottom: 12px;
    }

    #studyReasonBox,
    #exitReasonBox {
      display: none;
    }

    .helper {
      margin: -3px 0 12px;
      font-size: 13px;
      color: #687d88;
      line-height: 1.4;
    }

    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #07121a;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      border: 0;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start {
      background: #168c78;
      color: white;
    }

    .btn-stop {
      background: #d93d31;
      color: white;
    }

    #systemStatus {
      margin-top: 12px;
      padding: 13px;
      text-align: center;
      border-radius: 10px;
      background: #e7f6f2;
      color: #08634e;
      font-weight: bold;
      line-height: 1.5;
    }

    #resultCard {
      display: none;
      padding: 20px;
      margin-top: 15px;
      border-radius: 14px;
      text-align: center;
    }

    #resultCard.success {
      display: block;
      background: #effaf7;
      border: 2px solid #92d4c3;
    }

    #resultCard.error {
      display: block;
      background: #fff3f1;
      border: 2px solid #efaaa3;
    }

    #studentName {
      font-size: 27px;
      font-weight: 900;
      color: #168c78;
      margin-bottom: 7px;
    }

    #studentClass {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 9px;
    }

    .result-line {
      margin: 5px 0;
    }

    #attendanceNote {
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #dce5e9;
    }

    .stat-number {
      font-size: 27px;
      font-weight: bold;
      color: #168c78;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 850px;
    }

    th,
    td {
      padding: 10px 7px;
      border-bottom: 1px solid #e0e7ea;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f5f8fa;
      white-space: nowrap;
    }

    td.reason {
      max-width: 240px;
      word-break: break-word;
    }

    .empty-value {
      color: #8a989f;
    }

    .note {
      font-size: 12px;
      color: #73838d;
      text-align: center;
      margin-top: 15px;
    }

    @media(max-width:650px) {
      body {
        padding: 8px;
      }

      .status-grid,
      .camera-grid,
      .result-grid,
      .exit-grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 14px;
      }

      .header h1 {
        font-size: 22px;
      }

      table {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <span class="version">
      V7.5.1
    </span>

    <h1>
      QR ĐIỂM DANH HỌC SINH
    </h1>

    <p>
      Quét liên tục • Tự động ghi nhận • Camera không tắt sau mỗi lượt
    </p>

  </div>


  <div class="card">

    <label>
      Người điểm danh
    </label>

    <input
      id="teacher"
      type="text"
      placeholder="Nhập họ tên người điểm danh"
      autocomplete="name"
    >


    <label>
      Trạng thái
    </label>

    <div class="status-grid">

      <button
        class="status-btn active"
        onclick="selectStatus('Vào trường',this)"
      >
        VÀO TRƯỜNG
      </button>

      <button
        class="status-btn"
        onclick="selectStatus('Ra khỏi trường',this)"
      >
        RA KHỎI TRƯỜNG
      </button>

      <button
        class="status-btn"
        onclick="selectStatus('Vào học',this)"
      >
        VÀO HỌC
      </button>

    </div>


    <!-- RA KHỎI TRƯỜNG -->

    <div id="exitOptions">

      <label>
        Lý do ra khỏi trường
      </label>

      <div class="helper">
        Mặc định là <b>Về nghỉ</b>.
      </div>

      <div class="exit-grid">

        <button
          class="exit-btn active"
          onclick="selectExitResult('Về nghỉ',this)"
        >
          VỀ NGHỈ
        </button>

        <button
          class="exit-btn"
          onclick="selectExitResult('Xin ra ngoài - sẽ vào lại',this)"
        >
          XIN RA NGOÀI<br>
          SẼ VÀO LẠI
        </button>

        <button
          class="exit-btn"
          onclick="selectExitResult('Lý do khác',this)"
        >
          LÝ DO KHÁC
        </button>

      </div>


      <div id="exitReasonBox">

        <label>
          Nhập lý do khác
        </label>

        <input
          id="exitReason"
          type="text"
          placeholder="Ví dụ: Đi khám bệnh, gia đình đón..."
        >

      </div>

    </div>


    <!-- VÀO HỌC -->

    <div id="studyOptions">

      <label>
        Kết quả vào học
      </label>

      <div class="result-grid">

        <button
          class="result-btn active"
          onclick="selectStudyResult('Vào lớp',this)"
        >
          VÀO LỚP
        </button>

        <button
          class="result-btn"
          onclick="selectStudyResult('Không vào lớp',this)"
        >
          KHÔNG VÀO LỚP
        </button>

      </div>


      <div id="studyReasonBox">

        <label>
          Lý do không vào lớp
        </label>

        <input
          id="studyReason"
          type="text"
          placeholder="Có thể để trống → hệ thống ghi Không lý do"
        >

      </div>

    </div>


    <!-- CAMERA -->

    <label>
      Camera quét QR
    </label>

    <div id="reader"></div>


    <div class="camera-grid">

      <button
        class="btn btn-start"
        onclick="startScanner()"
      >
        BẬT CAMERA QUÉT LIÊN TỤC
      </button>

      <button
        class="btn btn-stop"
        onclick="stopScanner()"
      >
        TẮT CAMERA
      </button>

    </div>


    <div id="systemStatus">
      ● SẴN SÀNG
    </div>


    <!-- KẾT QUẢ -->

    <div id="resultCard">

      <div id="studentName"></div>

      <div id="studentClass"></div>

      <div
        id="studentId"
        class="result-line"
      ></div>

      <div
        id="attendanceStatus"
        class="result-line"
      ></div>

      <div
        id="attendanceTime"
        class="result-line"
      ></div>

      <div
        id="attendanceNote"
        class="result-line"
      ></div>

    </div>


    <div class="stats">

      <div class="stat">

        <div
          id="successCount"
          class="stat-number"
        >
          0
        </div>

        <div>
          THÀNH CÔNG
        </div>

      </div>


      <div class="stat">

        <div
          id="duplicateCount"
          class="stat-number"
        >
          0
        </div>

        <div>
          QUÉT TRÙNG
        </div>

      </div>

    </div>

  </div>


  <!-- LỊCH SỬ -->

  <div class="card">

    <h3>
      Lượt quét gần đây
    </h3>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Thời gian</th>
            <th>Học sinh</th>
            <th>Lớp</th>
            <th>Trạng thái</th>
            <th>Kết quả</th>
            <th>Lý do</th>
          </tr>

        </thead>

        <tbody id="historyBody"></tbody>

      </table>

    </div>

  </div>


  <div class="note">
    V7.5.1 • GitHub Pages + Apps Script • Dữ liệu lưu vào sheet DiemDanh
  </div>

</div>


<script>

/* =========================================================
   CẤU HÌNH
========================================================= */

const API_URL =
https://script.google.com/macros/s/AKfycbyd2lMlk9RZ76JfTCOcIf4S8Akl0o9HXOr_afbo6LcdGqXm4Tad48rcZqgRDUrwndLZhQ/exec 
const CALLBACK_NAME =
  'qrAttendanceCallback';

const API_TIMEOUT =
  15000;

const SAME_QR_LOCK =
  3000;


/* =========================================================
   BIẾN
========================================================= */

let scanner = null;

let scannerRunning = false;

let processing = false;

let selectedStatus =
  'Vào trường';

let selectedStudyResult =
  'Vào lớp';

let selectedExitResult =
  'Về nghỉ';

let lastQr = '';

let lastQrTime = 0;

let successCount = 0;

let duplicateCount = 0;

let jsonpResolve = null;

let jsonpReject = null;

let jsonpTimer = null;


/* =========================================================
   JSONP CALLBACK
========================================================= */

window.qrAttendanceCallback =
  function(data) {

    if (!jsonpResolve) {
      return;
    }

    const resolve =
      jsonpResolve;

    clearJsonp();

    resolve(data);
  };


/* =========================================================
   CHỌN TRẠNG THÁI
========================================================= */

function selectStatus(
  status,
  button
) {

  selectedStatus =
    status;


  document
    .querySelectorAll('.status-btn')
    .forEach(function(btn) {

      btn.classList.remove(
        'active'
      );

    });


  button.classList.add(
    'active'
  );


  const studyOptions =
    document.getElementById(
      'studyOptions'
    );


  const exitOptions =
    document.getElementById(
      'exitOptions'
    );


  studyOptions.style.display =
    'none';

  exitOptions.style.display =
    'none';


  if (
    status ===
    'Vào học'
  ) {

    studyOptions.style.display =
      'block';
  }


  if (
    status ===
    'Ra khỏi trường'
  ) {

    exitOptions.style.display =
      'block';
  }
}


/* =========================================================
   CHỌN KẾT QUẢ VÀO HỌC
========================================================= */

function selectStudyResult(
  result,
  button
) {

  selectedStudyResult =
    result;


  document
    .querySelectorAll('.result-btn')
    .forEach(function(btn) {

      btn.classList.remove(
        'active'
      );

    });


  button.classList.add(
    'active'
  );


  const reasonBox =
    document.getElementById(
      'studyReasonBox'
    );


  if (
    result ===
    'Không vào lớp'
  ) {

    reasonBox.style.display =
      'block';

  } else {

    reasonBox.style.display =
      'none';

  }
}


/* =========================================================
   CHỌN LÝ DO RA KHỎI TRƯỜNG
========================================================= */

function selectExitResult(
  result,
  button
) {

  selectedExitResult =
    result;


  document
    .querySelectorAll('.exit-btn')
    .forEach(function(btn) {

      btn.classList.remove(
        'active'
      );

    });


  button.classList.add(
    'active'
  );


  const reasonBox =
    document.getElementById(
      'exitReasonBox'
    );


  if (
    result ===
    'Lý do khác'
  ) {

    reasonBox.style.display =
      'block';


    setTimeout(function() {

      document
        .getElementById(
          'exitReason'
        )
        .focus();

    },100);

  } else {

    reasonBox.style.display =
      'none';

  }
}


/* =========================================================
   BẬT CAMERA
========================================================= */

async function startScanner() {

  if (scannerRunning) {
    return;
  }


  const teacher =
    getTeacher();


  if (!teacher) {

    alert(
      'Vui lòng nhập người điểm danh trước khi bật camera.'
    );


    document
      .getElementById(
        'teacher'
      )
      .focus();


    return;
  }


  localStorage.setItem(
    'qr_teacher',
    teacher
  );


  setSystemStatus(
    '● ĐANG MỞ CAMERA...'
  );


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {
        fps: 10,

        aspectRatio:
          1.333333,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * 0.70
              );


            return {
              width: size,
              height: size
            };
          }
      },

      onQrRead,

      function() {
        // Không có QR trong frame hiện tại.
      }
    );


    scannerRunning =
      true;


    setSystemStatus(
      '● CAMERA ĐANG QUÉT — ĐƯA QR HỌC SINH VÀO KHUNG'
    );

  } catch(error) {

    scannerRunning =
      false;


    setSystemStatus(
      '✕ KHÔNG MỞ ĐƯỢC CAMERA: ' +
      errorMessage(error)
    );

  }
}


/* =========================================================
   ĐỌC QR
========================================================= */

async function onQrRead(
  decodedText
) {

  const qr =
    normalizeQr(
      decodedText
    );


  if (
    !/^HS-[A-Z0-9]+$/.test(qr)
  ) {

    return;
  }


  if (processing) {
    return;
  }


  const now =
    Date.now();


  if (
    qr === lastQr &&
    now - lastQrTime <
      SAME_QR_LOCK
  ) {

    return;
  }


  const teacher =
    getTeacher();


  if (!teacher) {

    setSystemStatus(
      '⚠ CHƯA NHẬP NGƯỜI ĐIỂM DANH'
    );

    beepError();

    return;
  }


  let result = '';

  let reason = '';


  /* ==========================
     VÀO HỌC
  ========================== */

  if (
    selectedStatus ===
    'Vào học'
  ) {

    result =
      selectedStudyResult;


    if (
      selectedStudyResult ===
      'Không vào lớp'
    ) {

      reason =
        document
          .getElementById(
            'studyReason'
          )
          .value
          .trim();
    }
  }


  /* ==========================
     RA KHỎI TRƯỜNG
  ========================== */

  if (
    selectedStatus ===
    'Ra khỏi trường'
  ) {

    /*
     * Backend V7.5.1 sẽ chuyển:
     *
     * result = Về nghỉ
     * thành:
     * KetQua = Ra khỏi trường
     * GhiChu = Về nghỉ
     */

    result =
      selectedExitResult;


    if (
      selectedExitResult ===
      'Lý do khác'
    ) {

      reason =
        document
          .getElementById(
            'exitReason'
          )
          .value
          .trim();


      if (!reason) {

        setSystemStatus(
          '⚠ VUI LÒNG NHẬP LÝ DO RA KHỎI TRƯỜNG'
        );


        document
          .getElementById(
            'exitReason'
          )
          .focus();


        beepError();


        lastQr =
          qr;

        lastQrTime =
          now;


        return;
      }
    }
  }


  lastQr =
    qr;

  lastQrTime =
    now;

  processing =
    true;


  setSystemStatus(
    '⏳ ĐÃ ĐỌC QR — ĐANG GHI ĐIỂM DANH...'
  );


  try {

    const data =
      await saveAttendanceJsonp(
        qr,
        teacher,
        selectedStatus,
        result,
        reason
      );


    handleAttendanceResult(
      data,
      qr
    );

  } catch(error) {

    showError(
      'Không kết nối được Apps Script',
      qr
    );


    setSystemStatus(
      '✕ LỖI KẾT NỐI: ' +
      errorMessage(error)
    );


    beepError();

  } finally {

    processing =
      false;

  }
}


/* =========================================================
   GỌI API JSONP
========================================================= */

function saveAttendanceJsonp(
  qr,
  teacher,
  status,
  result,
  reason
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {

      clearJsonp();


      jsonpResolve =
        resolve;

      jsonpReject =
        reject;


      const script =
        document.createElement(
          'script'
        );


      script.id =
        'jsonp-attendance';


      script.onerror =
        function() {

          const rejectNow =
            jsonpReject;


          clearJsonp();


          if (rejectNow) {

            rejectNow(
              new Error(
                'Không tải được API Apps Script'
              )
            );

          }
        };


      script.src =
        API_URL +

        '?page=api-v7-save' +

        '&qr=' +
        encodeURIComponent(qr) +

        '&teacher=' +
        encodeURIComponent(teacher) +

        '&status=' +
        encodeURIComponent(status) +

        '&result=' +
        encodeURIComponent(result) +

        '&reason=' +
        encodeURIComponent(reason) +

        '&callback=' +
        CALLBACK_NAME +

        '&t=' +
        Date.now();


      jsonpTimer =
        setTimeout(
          function() {

            const rejectNow =
              jsonpReject;


            clearJsonp();


            if (rejectNow) {

              rejectNow(
                new Error(
                  'Apps Script không phản hồi sau 15 giây'
                )
              );

            }

          },
          API_TIMEOUT
        );


      document.body.appendChild(
        script
      );

    }
  );
}


/* =========================================================
   XỬ LÝ KẾT QUẢ
========================================================= */

function handleAttendanceResult(
  data,
  qr
) {

  if (
    data &&
    data.success
  ) {

    successCount++;


    updateCounters();


    showSuccess(
      data
    );


    addHistory(
      data
    );


    setSystemStatus(
      '✓ ĐÃ GHI ĐIỂM DANH — CAMERA TIẾP TỤC QUÉT'
    );


    beepSuccess();


    return;
  }


  if (
    data &&
    data.duplicate
  ) {

    duplicateCount++;


    updateCounters();


    showDuplicate(
      data
    );


    setSystemStatus(
      '⚠ QUÉT TRÙNG — KHÔNG GHI THÊM DỮ LIỆU'
    );


    beepDuplicate();


    return;
  }


  const message =
    data &&
    data.message
      ? data.message
      : 'Không thể ghi điểm danh';


  showError(
    message,
    qr
  );


  setSystemStatus(
    '✕ ' +
    message
  );


  beepError();
}


/* =========================================================
   HIỂN THỊ THÀNH CÔNG
========================================================= */

function showSuccess(
  data
) {

  const card =
    document.getElementById(
      'resultCard'
    );


  card.className =
    'success';


  document.getElementById(
    'studentName'
  ).textContent =
    data.hoTen || '';


  document.getElementById(
    'studentClass'
  ).textContent =
    data.lop
      ? 'LỚP ' + data.lop
      : '';


  document.getElementById(
    'studentId'
  ).textContent =
    'Mã HS: ' +
    (data.maHS || '');


  document.getElementById(
    'attendanceStatus'
  ).textContent =
    'Trạng thái: ' +
    (data.trangThai || '');


  document.getElementById(
    'attendanceTime'
  ).textContent =
    'Thời gian: ' +
    (data.thoiGian || '');


  let note = '';


  /* ==========================
     VÀO TRƯỜNG
  ========================== */

  if (
    data.trangThai ===
    'Vào trường'
  ) {

    note =
      'Kết quả: ' +
      (data.ketQua || 'Vào trường');
  }


  /* ==========================
     RA KHỎI TRƯỜNG
  ========================== */

  else if (
    data.trangThai ===
    'Ra khỏi trường'
  ) {

    note =
      'Kết quả: ' +
      (data.ketQua || 'Ra khỏi trường');


    if (data.ghiChu) {

      note +=
        ' — Lý do: ' +
        data.ghiChu;

    }
  }


  /* ==========================
     VÀO HỌC
  ========================== */

  else if (
    data.trangThai ===
    'Vào học'
  ) {

    note =
      'Kết quả: ' +
      (data.ketQua || '');


    if (data.ghiChu) {

      note +=
        ' — Lý do: ' +
        data.ghiChu;

    }
  }


  document.getElementById(
    'attendanceNote'
  ).textContent =
    note;
}

/* =========================================================
   LỊCH SỬ V7.5.1

   Hiển thị đúng dữ liệu BACKEND trả về:

   TrangThai | KetQua | GhiChu
========================================================= */

function addHistory(
  data
) {

  const body =
    document.getElementById(
      'historyBody'
    );


  const row =
    document.createElement(
      'tr'
    );


  const ketQua =
    data.ketQua &&
    String(data.ketQua).trim()
      ? data.ketQua
      : '—';


  const lyDo =
    data.ghiChu &&
    String(data.ghiChu).trim()
      ? data.ghiChu
      : '—';


  const values = [

    data.thoiGian || '',

    data.hoTen || '',

    data.lop || '',

    data.trangThai || '',

    ketQua,

    lyDo

  ];


  values.forEach(
    function(
      value,
      index
    ) {

      const td =
        document.createElement(
          'td'
        );


      td.textContent =
        value;


      if (
        index === 5
      ) {

        td.classList.add(
          'reason'
        );

      }


      if (
        value === '—'
      ) {

        td.classList.add(
          'empty-value'
        );

      }


      row.appendChild(
        td
      );

    }
  );


  body.insertBefore(
    row,
    body.firstChild
  );


  while (
    body.children.length >
    20
  ) {

    body.removeChild(
      body.lastChild
    );

  }
}


/* =========================================================
   TẮT CAMERA
========================================================= */

async function stopScanner() {

  if (
    !scanner ||
    !scannerRunning
  ) {

    setSystemStatus(
      '● CAMERA ĐÃ TẮT'
    );


    return;
  }


  try {

    await scanner.stop();


    scanner.clear();

  } catch(error) {

    console.warn(
      error
    );

  }


  scannerRunning =
    false;

  processing =
    false;


  clearJsonp();


  setSystemStatus(
    '● CAMERA ĐÃ TẮT'
  );
}


/* =========================================================
   XÓA JSONP
========================================================= */

function clearJsonp() {

  if (jsonpTimer) {

    clearTimeout(
      jsonpTimer
    );


    jsonpTimer =
      null;
  }


  const oldScript =
    document.getElementById(
      'jsonp-attendance'
    );


  if (oldScript) {

    oldScript.remove();

  }


  jsonpResolve =
    null;

  jsonpReject =
    null;
}

/* =========================================================
   CHUẨN HÓA QR
========================================================= */

function normalizeQr(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /\u0000/g,
      ''
    )
    .replace(
      /\r/g,
      ''
    )
    .replace(
      /\n/g,
      ''
    )
    .trim()
    .toUpperCase();
}

========================================================= */

function beepSuccess() {

    1050,
    120
  );
}


function beepDuplicate() {

  beep(
    650,
    180
  );
}


function beepError() {

  beep(
    350,
    300
  );
}


function beep(
  frequency,
  duration
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.frequency.value =
      frequency;


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    gain.gain.value =
      0.12;


    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

        ctx.close();

      },
      duration
    );

  } catch(error) {

    // Âm thanh không ảnh hưởng chức năng.

  }
}


/* =========================================================
   LỖI
========================================================= */

function errorMessage(
  error
) {

  if (!error) {

    return 'Không xác định';

  }


  return (
    error.message ||
    String(error)
  );
}
