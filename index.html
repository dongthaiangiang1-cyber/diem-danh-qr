<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QR Điểm danh V7.3.1</title>

  <!-- Thư viện đọc QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f2f6f8;
      color: #17324d;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #168672;
      font-size: 30px;
    }

    .subtitle {
      margin-top: 8px;
      margin-bottom: 20px;
      text-align: center;
      color: #687985;
      font-size: 16px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #07121a;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-start {
      background: #168672;
      color: white;
    }

    .btn-stop {
      background: #d63b2e;
      color: white;
    }

    #status {
      margin-top: 12px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
      background: #e8f7f3;
      color: #086247;
    }

    .student-card {
      display: none;
      margin-top: 16px;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
    }

    .student-card.success {
      display: block;
      background: #f0faf7;
      border: 2px solid #9ad7c8;
    }

    .student-card.error {
      display: block;
      background: #fff4f2;
      border: 2px solid #f0aaa2;
    }

    #studentName {
      font-size: 29px;
      font-weight: 900;
      color: #168672;
      margin-bottom: 8px;
    }

    #studentClass {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 13px;
    }

    .student-info {
      margin-top: 6px;
      font-size: 16px;
    }

    #studentQr {
      margin-top: 12px;
      color: #667985;
      font-family: monospace;
      word-break: break-all;
    }

    .history {
      margin-top: 22px;
    }

    .history h3 {
      margin: 0 0 12px 0;
    }

    #historyList {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    #historyList li {
      padding: 11px;
      margin-bottom: 7px;
      background: #f5f8fa;
      border-radius: 9px;
      line-height: 1.5;
    }

    .small {
      margin-top: 15px;
      text-align: center;
      color: #80909b;
      font-size: 12px;
    }

  </style>
</head>


<body>

<div class="container">

  <h1>QR ĐIỂM DANH V7.3.1</h1>

  <div class="subtitle">
    Camera → QR → Apps Script → HOC_SINH
  </div>


  <!-- CAMERA -->
  <div id="reader"></div>


  <!-- NÚT -->
  <button
    class="btn-start"
    onclick="startScanner()"
  >
    BẬT CAMERA QUÉT QR
  </button>

  <button
    class="btn-stop"
    onclick="stopScanner()"
  >
    TẮT CAMERA
  </button>


  <!-- TRẠNG THÁI -->
  <div id="status">
    ● SẴN SÀNG
  </div>


  <!-- THÔNG TIN HỌC SINH -->
  <div
    id="studentCard"
    class="student-card"
  >

    <div id="studentName"></div>

    <div id="studentClass"></div>

    <div
      id="studentId"
      class="student-info"
    ></div>

    <div
      id="studentStatus"
      class="student-info"
    ></div>

    <div id="studentQr"></div>

  </div>


  <!-- LỊCH SỬ -->
  <div class="history">

    <h3>Lịch sử kiểm tra</h3>

    <ul id="historyList"></ul>

  </div>


  <div class="small">
    V7.3.1 • JSONP • Chưa ghi dữ liệu điểm danh
  </div>

</div>


<script>

/* =========================================================
   1. CẤU HÌNH
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzuQFFbBkdTl_BV6sYRJIEAFk-yMI9p8BN2SrjjUzXkkO2ihkjeWPkjdCZseSudEyKPLg/exec';


const JSONP_CALLBACK =
  'qrStudentCallback';


const SAME_QR_LOCK =
  3000;


const API_TIMEOUT =
  15000;


/* =========================================================
   2. BIẾN HỆ THỐNG
========================================================= */

let scanner = null;

let scannerRunning = false;

let processing = false;

let lastQr = '';

let lastQrTime = 0;

let jsonpResolve = null;

let jsonpReject = null;

let jsonpTimer = null;


/* =========================================================
   3. CALLBACK JSONP CỐ ĐỊNH
========================================================= */

/*
 * Apps Script sẽ trả về dạng:
 *
 * qrStudentCallback({...});
 *
 * Hàm này PHẢI nằm ở phạm vi window.
 */

window.qrStudentCallback =
  function(data) {

    if (!jsonpResolve) {
      return;
    }


    const resolve =
      jsonpResolve;


    clearJsonpRequest();


    resolve(data);
  };


/* =========================================================
   4. BẬT CAMERA
========================================================= */

async function startScanner() {

  if (scannerRunning) {

    setStatus(
      '● CAMERA ĐANG HOẠT ĐỘNG'
    );

    return;
  }


  setStatus(
    '● ĐANG MỞ CAMERA...'
  );


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {
        fps: 10,

        aspectRatio:
          1.333333,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * 0.70
              );


            return {

              width:
                size,

              height:
                size

            };
          }
      },

      onQrRead,

      function() {
        /*
         * Không cần xử lý khi
         * một frame chưa có QR.
         */
      }

    );


    scannerRunning =
      true;


    setStatus(
      '● CAMERA ĐANG QUÉT — ĐƯA QR HỌC SINH VÀO KHUNG'
    );

  }
  catch (error) {

    console.error(
      'Camera error:',
      error
    );


    scannerRunning =
      false;


    setStatus(
      '✕ KHÔNG MỞ ĐƯỢC CAMERA: ' +
      getErrorMessage(error)
    );

  }

}


/* =========================================================
   5. ĐỌC QR
========================================================= */

async function onQrRead(
  decodedText
) {

  const qr =
    normalizeQr(
      decodedText
    );


  if (!qr) {
    return;
  }


  /*
   * Chỉ nhận QR học sinh.
   */
  if (
    !/^HS-[A-Z0-9]+$/.test(qr)
  ) {

    setStatus(
      '⚠ QR KHÔNG PHẢI MÃ HỌC SINH'
    );

    return;
  }


  /*
   * Khi đang tra một học sinh,
   * không gửi thêm yêu cầu.
   */
  if (processing) {
    return;
  }


  const now =
    Date.now();


  /*
   * Chống camera đọc cùng một
   * mã liên tục.
   */
  if (
    qr === lastQr &&
    now - lastQrTime <
      SAME_QR_LOCK
  ) {

    return;
  }


  lastQr =
    qr;


  lastQrTime =
    now;


  processing =
    true;


  setStatus(
    '⏳ ĐÃ ĐỌC ' +
    qr +
    ' — ĐANG TRA HỌC SINH...'
  );


  try {

    const data =
      await lookupStudentJsonp(
        qr
      );


    if (
      data &&
      data.success
    ) {

      showStudent(
        data
      );


      addHistory(
        data
      );


      setStatus(
        '✓ TÌM THẤY HỌC SINH — CAMERA TIẾP TỤC QUÉT'
      );


      beepSuccess();

    }
    else {

      const message =
        data &&
        data.message
          ? data.message
          : 'Không tìm thấy học sinh';


      showError(
        message,
        qr
      );


      setStatus(
        '✕ ' +
        message
      );


      beepError();

    }

  }
  catch (error) {

    console.error(
      'JSONP error:',
      error
    );


    showError(
      'Không kết nối được Apps Script',
      qr
    );


    setStatus(
      '✕ LỖI KẾT NỐI JSONP: ' +
      getErrorMessage(error)
    );


    beepError();

  }
  finally {

    processing =
      false;

  }

}


/* =========================================================
   6. TRA HỌC SINH BẰNG JSONP
========================================================= */

function lookupStudentJsonp(
  qr
) {

  return new Promise(
    function(resolve, reject) {

      /*
       * Xóa request cũ nếu có.
       */
      clearJsonpRequest();


      jsonpResolve =
        resolve;


      jsonpReject =
        reject;


      const script =
        document.createElement(
          'script'
        );


      script.id =
        'jsonp-api';


      /*
       * Nếu trình duyệt không
       * tải được script.
       */
      script.onerror =
        function() {

          const rejectCurrent =
            jsonpReject;


          clearJsonpRequest();


          if (
            rejectCurrent
          ) {

            rejectCurrent(
              new Error(
                'Không tải được API Apps Script'
              )
            );

          }

        };


      /*
       * URL có dạng:
       *
       * .../exec
       * ?page=api-v7-test
       * &qr=HS-...
       * &callback=qrStudentCallback
       */
      script.src =
        API_URL +
        '?page=api-v7-test' +
        '&qr=' +
        encodeURIComponent(
          qr
        ) +
        '&callback=' +
        JSONP_CALLBACK +
        '&t=' +
        Date.now();


      /*
       * Nếu Apps Script không
       * gọi callback sau 15 giây.
       */
      jsonpTimer =
        setTimeout(
          function() {

            const rejectCurrent =
              jsonpReject;


            clearJsonpRequest();


            if (
              rejectCurrent
            ) {

              rejectCurrent(
                new Error(
                  'Apps Script không phản hồi sau 15 giây'
                )
              );

            }

          },
          API_TIMEOUT
        );


      /*
       * Gắn script vào trang.
       */
      document.body.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   7. XÓA REQUEST JSONP
========================================================= */

function clearJsonpRequest() {

  if (jsonpTimer) {

    clearTimeout(
      jsonpTimer
    );

    jsonpTimer =
      null;
  }


  const oldScript =
    document.getElementById(
      'jsonp-api'
    );


  if (oldScript) {

    oldScript.remove();

  }


  jsonpResolve =
    null;


  jsonpReject =
    null;

}


/* =========================================================
   8. HIỂN THỊ HỌC SINH
========================================================= */

function showStudent(
  student
) {

  const card =
    document.getElementById(
      'studentCard'
    );


  card.className =
    'student-card success';


  document.getElementById(
    'studentName'
  ).textContent =
    student.hoTen || '';


  document.getElementById(
    'studentClass'
  ).textContent =
    student.lop
      ? 'LỚP ' +
        student.lop
      : '';


  document.getElementById(
    'studentId'
  ).textContent =
    'Mã HS: ' +
    (
      student.maHS || ''
    );


  document.getElementById(
    'studentStatus'
  ).textContent =
    'Trạng thái: ' +
    (
      student.trangThai || ''
    );


  document.getElementById(
    'studentQr'
  ).textContent =
    student.maQR || '';

}


/* =========================================================
   9. HIỂN THỊ LỖI
========================================================= */

function showError(
  message,
  qr
) {

  const card =
    document.getElementById(
      'studentCard'
    );


  card.className =
    'student-card error';


  document.getElementById(
    'studentName'
  ).textContent =
    'KHÔNG TÌM THẤY';


  document.getElementById(
    'studentClass'
  ).textContent =
    message || '';


  document.getElementById(
    'studentId'
  ).textContent =
    '';


  document.getElementById(
    'studentStatus'
  ).textContent =
    '';


  document.getElementById(
    'studentQr'
  ).textContent =
    qr || '';

}


/* =========================================================
   10. LỊCH SỬ TRA CỨU
========================================================= */

function addHistory(
  student
) {

  const list =
    document.getElementById(
      'historyList'
    );


  const item =
    document.createElement(
      'li'
    );


  const time =
    new Date()
      .toLocaleTimeString(
        'vi-VN'
      );


  item.textContent =
    time +
    ' — ' +
    student.hoTen +
    ' — ' +
    student.lop +
    ' — ' +
    student.maHS;


  list.insertBefore(
    item,
    list.firstChild
  );


  /*
   * Chỉ giữ 10 lượt gần nhất.
   */
  while (
    list.children.length >
    10
  ) {

    list.removeChild(
      list.lastChild
    );

  }

}


/* =========================================================
   11. TẮT CAMERA
========================================================= */

async function stopScanner() {

  if (
    !scanner ||
    !scannerRunning
  ) {

    setStatus(
      '● CAMERA ĐÃ TẮT'
    );

    return;
  }


  try {

    await scanner.stop();


    scanner.clear();

  }
  catch (error) {

    console.warn(
      'Stop camera:',
      error
    );

  }


  scannerRunning =
    false;


  processing =
    false;


  clearJsonpRequest();


  setStatus(
    '● CAMERA ĐÃ TẮT'
  );

}


/* =========================================================
   12. CHUẨN HÓA QR
========================================================= */

function normalizeQr(
  value
) {

  return String(
    value || ''
  )
  .replace(
    /\u0000/g,
    ''
  )
  .replace(
    /\r/g,
    ''
  )
  .replace(
    /\n/g,
    ''
  )
  .trim()
  .toUpperCase();

}


/* =========================================================
   13. HIỂN THỊ TRẠNG THÁI
========================================================= */

function setStatus(
  text
) {

  document.getElementById(
    'status'
  ).textContent =
    text;

}


/* =========================================================
   14. ÂM THANH THÀNH CÔNG
========================================================= */

function beepSuccess() {

  beep(
    1050,
    120
  );

}


/* =========================================================
   15. ÂM THANH LỖI
========================================================= */

function beepError() {

  beep(
    350,
    300
  );

}


/* =========================================================
   16. TẠO ÂM THANH
========================================================= */

function beep(
  frequency,
  duration
) {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.frequency.value =
      frequency;


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    gain.gain.value =
      0.12;


    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

        ctx.close();

      },
      duration
    );

  }
  catch (error) {

    /*
     * Nếu trình duyệt chặn âm thanh,
     * hệ thống vẫn tiếp tục hoạt động.
     */

  }

}


/* =========================================================
   17. LẤY THÔNG BÁO LỖI
========================================================= */

function getErrorMessage(
  error
) {

  if (!error) {

    return 'Không xác định';

  }


  if (error.message) {

    return error.message;

  }


  return String(
    error
  );

}

</script>

</body>
</html>
