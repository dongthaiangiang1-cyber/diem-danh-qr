<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0">

  <title>QR Điểm danh V7.2</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f2f6f8;
      color:#17324d;
    }

    .box{
      max-width:760px;
      margin:auto;
      padding:22px;
      background:#fff;
      border-radius:18px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }

    h1{
      margin:0 0 8px;
      text-align:center;
      color:#168672;
    }

    .subtitle{
      margin-bottom:20px;
      text-align:center;
      color:#6b7d8d;
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:14px;
    }

    button{
      width:100%;
      margin-top:10px;
      padding:15px;
      border:0;
      border-radius:10px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .start{
      background:#168672;
      color:#fff;
    }

    .stop{
      background:#cf3b2d;
      color:#fff;
    }

    #status{
      margin-top:15px;
      padding:14px;
      border-radius:10px;
      text-align:center;
      background:#eaf8f4;
      color:#086247;
      font-weight:bold;
      line-height:1.5;
    }

    .student{
      display:none;
      margin-top:18px;
      padding:20px;
      border:2px solid #d9e5e9;
      border-radius:15px;
      text-align:center;
    }

    .student.success{
      display:block;
      border-color:#99d8c8;
      background:#f2fbf8;
    }

    .student.error{
      display:block;
      border-color:#efb1aa;
      background:#fff4f2;
    }

    .name{
      margin-bottom:8px;
      font-size:28px;
      font-weight:900;
      color:#168672;
    }

    .class{
      margin-bottom:14px;
      font-size:21px;
      font-weight:bold;
    }

    .info{
      margin:5px 0;
      font-size:16px;
    }

    .qr{
      margin-top:10px;
      color:#687985;
      font-family:monospace;
      word-break:break-all;
    }

    .history{
      margin-top:20px;
    }

    .history h3{
      margin-bottom:10px;
    }

    #historyList{
      margin:0;
      padding:0;
      list-style:none;
    }

    #historyList li{
      margin-bottom:7px;
      padding:11px;
      border-radius:9px;
      background:#f5f8fa;
      line-height:1.5;
    }

    .checking{
      opacity:.65;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>QR ĐIỂM DANH V7.2</h1>

  <div class="subtitle">
    Kiểm tra kết nối dữ liệu học sinh
  </div>

  <div id="reader"></div>

  <button
    class="start"
    onclick="startScanner()">
    BẬT CAMERA QUÉT QR
  </button>

  <button
    class="stop"
    onclick="stopScanner()">
    TẮT CAMERA
  </button>

  <div id="status">
    ● SẴN SÀNG
  </div>

  <div
    id="studentBox"
    class="student">

    <div
      id="studentName"
      class="name">
    </div>

    <div
      id="studentClass"
      class="class">
    </div>

    <div
      id="studentId"
      class="info">
    </div>

    <div
      id="studentStatus"
      class="info">
    </div>

    <div
      id="studentQr"
      class="qr">
    </div>

  </div>

  <div class="history">

    <h3>Lịch sử kiểm tra</h3>

    <ul id="historyList"></ul>

  </div>

</div>


<script>

/* ==========================================================
   APPS SCRIPT API
========================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzuQFFbBkdTl_BV6sYRJIEAFk-yMI9p8BN2SrjjUzXkkO2ihkjeWPkjdCZseSudEyKPLg/exec';


/* ==========================================================
   SCANNER
========================================================== */

let scanner = null;

let running = false;

let processing = false;

let lastQr = '';

let lastQrTime = 0;

const SAME_QR_LOCK = 3000;


/* ==========================================================
   BẬT CAMERA
========================================================== */

async function startScanner(){

  if(running){
    return;
  }

  setStatus(
    '● ĐANG MỞ CAMERA...'
  );

  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );

    await scanner.start(

      {
        facingMode:'environment'
      },

      {
        fps:10,

        qrbox:function(
          width,
          height
        ){

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );

          return {
            width:size,
            height:size
          };

        }
      },

      onQrRead,

      function(){
        // Frame chưa nhận QR.
      }

    );

    running = true;

    setStatus(
      '● CAMERA ĐANG QUÉT — ĐƯA QR HỌC SINH VÀO KHUNG'
    );

  }
  catch(error){

    console.error(error);

    setStatus(
      '✕ KHÔNG MỞ ĐƯỢC CAMERA: ' +
      getErrorMessage(error)
    );

  }

}


/* ==========================================================
   KHI ĐỌC ĐƯỢC QR
========================================================== */

async function onQrRead(decodedText){

  const qr =
    normalizeQr(
      decodedText
    );

  if(!qr){
    return;
  }


  /*
   * Chỉ nhận mã QR học sinh.
   */
  if(
    !/^HS-[A-Z0-9]+$/i.test(qr)
  ){

    setStatus(
      '⚠ QR KHÔNG PHẢI MÃ HỌC SINH'
    );

    return;

  }


  const now =
    Date.now();


  /*
   * QR đang xử lý thì không gửi lại.
   */
  if(processing){
    return;
  }


  /*
   * Chống đọc liên tục cùng một QR.
   */
  if(
    qr === lastQr &&
    now - lastQrTime <
      SAME_QR_LOCK
  ){
    return;
  }


  lastQr =
    qr;

  lastQrTime =
    now;

  processing =
    true;


  setStatus(
    '⏳ ĐÃ ĐỌC ' +
    qr +
    ' — ĐANG TRA HỌC SINH...'
  );


  const box =
    document.getElementById(
      'studentBox'
    );

  box.classList.add(
    'checking'
  );


  try{

    const student =
      await lookupStudent(qr);


    if(
      student &&
      student.success
    ){

      showStudent(
        student
      );

      addHistory(
        student
      );

      setStatus(
        '✓ TÌM THẤY HỌC SINH — CAMERA TIẾP TỤC QUÉT'
      );

      beepSuccess();

    }
    else{

      showError(
        student &&
        student.message
          ? student.message
          : 'Không tìm thấy học sinh',
        qr
      );

      setStatus(
        '✕ ' +
        (
          student &&
          student.message
            ? student.message
            : 'Không tìm thấy học sinh'
        )
      );

      beepError();

    }

  }
  catch(error){

    console.error(error);

    showError(
      'Không kết nối được Apps Script',
      qr
    );

    setStatus(
      '✕ LỖI KẾT NỐI API: ' +
      getErrorMessage(error)
    );

    beepError();

  }
  finally{

    box.classList.remove(
      'checking'
    );

    processing =
      false;

  }

}


/* ==========================================================
   GỌI APPS SCRIPT
========================================================== */

async function lookupStudent(qr){

  const url =
    API_URL +
    '?page=api-v7-test' +
    '&qr=' +
    encodeURIComponent(qr) +
    '&_=' +
    Date.now();


  const response =
    await fetch(
      url,
      {
        method:'GET',
        cache:'no-store',
        redirect:'follow'
      }
    );


  if(!response.ok){

    throw new Error(
      'HTTP ' +
      response.status
    );

  }


  const text =
    await response.text();


  try{

    return JSON.parse(
      text
    );

  }
  catch(error){

    console.error(
      'API response:',
      text
    );

    throw new Error(
      'Apps Script không trả về JSON hợp lệ'
    );

  }

}


/* ==========================================================
   HIỂN THỊ HỌC SINH
========================================================== */

function showStudent(student){

  const box =
    document.getElementById(
      'studentBox'
    );


  box.className =
    'student success';


  document.getElementById(
    'studentName'
  ).textContent =
    student.hoTen || '';


  document.getElementById(
    'studentClass'
  ).textContent =
    student.lop
      ? 'LỚP ' + student.lop
      : '';


  document.getElementById(
    'studentId'
  ).textContent =
    'Mã HS: ' +
    (
      student.maHS || ''
    );


  document.getElementById(
    'studentStatus'
  ).textContent =
    'Trạng thái: ' +
    (
      student.trangThai || ''
    );


  document.getElementById(
    'studentQr'
  ).textContent =
    student.maQR || '';

}


/* ==========================================================
   HIỂN THỊ LỖI
========================================================== */

function showError(
  message,
  qr
){

  const box =
    document.getElementById(
      'studentBox'
    );


  box.className =
    'student error';


  document.getElementById(
    'studentName'
  ).textContent =
    'KHÔNG TÌM THẤY';


  document.getElementById(
    'studentClass'
  ).textContent =
    message || '';


  document.getElementById(
    'studentId'
  ).textContent =
    '';


  document.getElementById(
    'studentStatus'
  ).textContent =
    '';


  document.getElementById(
    'studentQr'
  ).textContent =
    qr || '';

}


/* ==========================================================
   LỊCH SỬ
========================================================== */

function addHistory(student){

  const list =
    document.getElementById(
      'historyList'
    );


  const item =
    document.createElement(
      'li'
    );


  const time =
    new Date()
      .toLocaleTimeString(
        'vi-VN'
      );


  item.textContent =
    time +
    ' — ' +
    student.hoTen +
    ' — ' +
    student.lop +
    ' — ' +
    student.maHS;


  list.insertBefore(
    item,
    list.firstChild
  );


  while(
    list.children.length > 10
  ){

    list.removeChild(
      list.lastChild
    );

  }

}


/* ==========================================================
   TẮT CAMERA
========================================================== */

async function stopScanner(){

  if(
    !scanner ||
    !running
  ){
    return;
  }


  try{

    await scanner.stop();

    scanner.clear();

  }
  catch(error){

    console.warn(
      error
    );

  }


  running =
    false;


  processing =
    false;


  setStatus(
    '● CAMERA ĐÃ TẮT'
  );

}


/* ==========================================================
   CHUẨN HÓA QR
========================================================== */

function normalizeQr(value){

  return String(
    value || ''
  )
  .replace(
    /\u0000/g,
    ''
  )
  .replace(
    /\r/g,
    ''
  )
  .replace(
    /\n/g,
    ''
  )
  .trim()
  .toUpperCase();

}


/* ==========================================================
   STATUS
========================================================== */

function setStatus(text){

  document.getElementById(
    'status'
  ).textContent =
    text;

}


/* ==========================================================
   ÂM THANH THÀNH CÔNG
========================================================== */

function beepSuccess(){

  beep(
    1050,
    120
  );

}


/* ==========================================================
   ÂM THANH LỖI
========================================================== */

function beepError(){

  beep(
    350,
    300
  );

}


/* ==========================================================
   BEEP
========================================================== */

function beep(
  frequency,
  duration
){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.frequency.value =
      frequency;


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    gain.gain.value =
      0.12;


    oscillator.start();


    setTimeout(
      function(){

        oscillator.stop();

        ctx.close();

      },
      duration
    );

  }
  catch(error){
    // Không ảnh hưởng chức năng chính.
  }

}


/* ==========================================================
   ERROR MESSAGE
========================================================== */

function getErrorMessage(error){

  if(!error){
    return 'Không xác định';
  }


  if(error.message){
    return error.message;
  }


  return String(
    error
  );

}

</script>

</body>
</html>
