<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1.0">

  <title>QR Scanner V7.1</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f2f6f8;
      color:#17324d;
    }

    .box{
      max-width:760px;
      margin:auto;
      background:white;
      padding:22px;
      border-radius:18px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }

    h1{
      margin-top:0;
      text-align:center;
      color:#168672;
    }

    .subtitle{
      text-align:center;
      color:#6b7d8d;
      margin-bottom:20px;
    }

    #reader{
      width:100%;
      overflow:hidden;
      border-radius:14px;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:10px;
      border:0;
      border-radius:10px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .start{
      background:#168672;
      color:white;
    }

    .stop{
      background:#c63b2d;
      color:white;
    }

    .status{
      margin-top:15px;
      padding:13px;
      border-radius:10px;
      text-align:center;
      background:#eaf8f4;
      color:#086247;
      font-weight:bold;
    }

    .result{
      margin-top:18px;
      padding:20px;
      border:2px solid #d7e2e8;
      border-radius:14px;
      text-align:center;
    }

    .result-title{
      color:#6b7d8d;
      font-size:13px;
      font-weight:bold;
    }

    #qrValue{
      margin-top:10px;
      font-size:25px;
      font-weight:900;
      color:#168672;
      word-break:break-all;
    }

    #counter{
      margin-top:8px;
      color:#6b7d8d;
    }

    .history{
      margin-top:18px;
    }

    .history h3{
      margin-bottom:8px;
    }

    #historyList{
      padding:0;
      list-style:none;
    }

    #historyList li{
      padding:10px;
      margin-bottom:6px;
      border-radius:8px;
      background:#f5f8fa;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>QR ĐIỂM DANH V7.1</h1>

  <div class="subtitle">
    Kiểm tra quét QR liên tục
  </div>

  <div id="reader"></div>

  <button
    id="startBtn"
    class="start"
    onclick="startScanner()">
    BẬT CAMERA QUÉT QR
  </button>

  <button
    id="stopBtn"
    class="stop"
    onclick="stopScanner()">
    TẮT CAMERA
  </button>

  <div id="status" class="status">
    ● SẴN SÀNG
  </div>

  <div class="result">

    <div class="result-title">
      MÃ QR VỪA ĐỌC
    </div>

    <div id="qrValue">
      Chưa có
    </div>

    <div id="counter">
      Đã đọc: 0 lượt
    </div>

  </div>

  <div class="history">

    <h3>Lịch sử kiểm tra</h3>

    <ul id="historyList"></ul>

  </div>

</div>

<script>

let scanner = null;

let running = false;

let lastQr = '';

let lastQrTime = 0;

let count = 0;

const SAME_QR_LOCK = 3000;


/* ==============================
   START
============================== */

async function startScanner(){

  if(running){
    return;
  }

  document.getElementById('status')
    .innerHTML =
    '● ĐANG MỞ CAMERA...';


  try{

    scanner =
      new Html5Qrcode(
        'reader',
        {
          verbose:false
        }
      );


    await scanner.start(

      {
        facingMode:'environment'
      },

      {
        fps:10,

        qrbox:function(
          viewfinderWidth,
          viewfinderHeight
        ){

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.70
            );

          return {
            width:size,
            height:size
          };

        },

        aspectRatio:1.333333

      },

      onQrRead,

      function(){
        /* không làm gì khi frame chưa có QR */
      }

    );


    running = true;


    document.getElementById('status')
      .innerHTML =
      '● CAMERA ĐANG QUÉT — ĐƯA QR VÀO KHUNG';

  }
  catch(error){

    console.error(error);

    document.getElementById('status')
      .innerHTML =
      '✕ LỖI CAMERA: ' +
      (
        error.message ||
        error
      );

  }

}


/* ==============================
   QR DETECTED
============================== */

function onQrRead(decodedText){

  const qr =
    normalizeQr(
      decodedText
    );


  if(!qr){
    return;
  }


  /*
   * Chỉ nhận QR học sinh
   */

  if(
    !/^HS-[A-Z0-9]+$/i.test(qr)
  ){

    document.getElementById('status')
      .innerHTML =
      '⚠ ĐÃ ĐỌC QR NHƯNG KHÔNG PHẢI MÃ HỌC SINH';

    return;

  }


  const now =
    Date.now();


  /*
   * Chống việc một QR đứng trước camera
   * bị đọc liên tục.
   */

  if(
    qr === lastQr &&
    (
      now -
      lastQrTime
    ) <
    SAME_QR_LOCK
  ){
    return;
  }


  lastQr =
    qr;

  lastQrTime =
    now;


  count++;


  document.getElementById('qrValue')
    .textContent =
    qr;


  document.getElementById('counter')
    .textContent =
    'Đã đọc: ' +
    count +
    ' lượt';


  document.getElementById('status')
    .innerHTML =
    '✓ ĐÃ ĐỌC QR — CAMERA TIẾP TỤC HOẠT ĐỘNG';


  addHistory(qr);

  beep();


  /*
   * Không stop scanner.
   * Camera tiếp tục quét học sinh tiếp theo.
   */

}


/* ==============================
   HISTORY
============================== */

function addHistory(qr){

  const list =
    document.getElementById(
      'historyList'
    );


  const item =
    document.createElement('li');


  const time =
    new Date()
      .toLocaleTimeString(
        'vi-VN'
      );


  item.textContent =
    time +
    ' — ' +
    qr;


  list.insertBefore(
    item,
    list.firstChild
  );


  while(
    list.children.length > 10
  ){

    list.removeChild(
      list.lastChild
    );

  }

}


/* ==============================
   NORMALIZE
============================== */

function normalizeQr(value){

  return String(
    value || ''
  )
  .replace(/\u0000/g,'')
  .replace(/\r/g,'')
  .replace(/\n/g,'')
  .trim()
  .toUpperCase();

}


/* ==============================
   BEEP
============================== */

function beep(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.frequency.value =
      1050;


    oscillator.connect(gain);

    gain.connect(
      ctx.destination
    );


    gain.gain.value =
      0.12;


    oscillator.start();


    setTimeout(
      function(){

        oscillator.stop();

        ctx.close();

      },
      120
    );

  }
  catch(e){}

}


/* ==============================
   STOP
============================== */

async function stopScanner(){

  if(
    !scanner ||
    !running
  ){
    return;
  }


  try{

    await scanner.stop();

    scanner.clear();

  }
  catch(e){

    console.warn(e);

  }


  running = false;


  document.getElementById('status')
    .innerHTML =
    '● CAMERA ĐÃ TẮT';

}

</script>

</body>
</html>
