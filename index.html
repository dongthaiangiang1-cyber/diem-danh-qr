<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Điểm danh V7.4.1</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:18px;
      font-family:Arial,sans-serif;
      background:#f2f6f8;
      color:#17324d;
    }

    .container{
      max-width:950px;
      margin:auto;
    }

    .header{
      background:#147c6d;
      color:white;
      padding:20px;
      border-radius:18px;
      margin-bottom:15px;
    }

    .header h1{
      margin:0;
      font-size:28px;
    }

    .header p{
      margin:7px 0 0;
      opacity:.9;
    }

    .version{
      float:right;
      padding:7px 13px;
      border:1px solid rgba(255,255,255,.5);
      border-radius:20px;
      font-weight:bold;
    }

    .card{
      background:white;
      border-radius:16px;
      padding:20px;
      margin-bottom:15px;
      box-shadow:0 5px 20px rgba(0,0,0,.06);
    }

    label{
      display:block;
      margin-bottom:7px;
      font-weight:bold;
    }

    input{
      width:100%;
      padding:13px;
      border:1px solid #cbd8df;
      border-radius:9px;
      font-size:16px;
      margin-bottom:15px;
    }

    .status-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
      margin-bottom:15px;
    }

    .status-btn,
    .result-btn{
      padding:14px 8px;
      border:1px solid #bfd0d8;
      background:white;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
      color:#17324d;
    }

    .status-btn.active,
    .result-btn.active{
      background:#168c78;
      color:white;
      border-color:#168c78;
    }

    #studyOptions{
      display:none;
      padding:14px;
      margin-bottom:15px;
      border-radius:12px;
      background:#f4f8fa;
    }

    .result-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-bottom:12px;
    }

    #reasonBox{
      display:none;
    }

    #reader{
      width:100%;
      border-radius:14px;
      overflow:hidden;
      background:#07121a;
    }

    .camera-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:10px;
    }

    .btn{
      border:0;
      padding:14px;
      border-radius:10px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-start{
      background:#168c78;
      color:white;
    }

    .btn-stop{
      background:#d93d31;
      color:white;
    }

    #systemStatus{
      margin-top:12px;
      padding:13px;
      text-align:center;
      border-radius:10px;
      background:#e7f6f2;
      color:#08634e;
      font-weight:bold;
      line-height:1.5;
    }

    #resultCard{
      display:none;
      padding:20px;
      margin-top:15px;
      border-radius:14px;
      text-align:center;
    }

    #resultCard.success{
      display:block;
      background:#effaf7;
      border:2px solid #92d4c3;
    }

    #resultCard.error{
      display:block;
      background:#fff3f1;
      border:2px solid #efaaa3;
    }

    #studentName{
      font-size:27px;
      font-weight:900;
      color:#168c78;
      margin-bottom:7px;
    }

    #studentClass{
      font-size:20px;
      font-weight:bold;
      margin-bottom:9px;
    }

    .result-line{
      margin:5px 0;
    }

    .stats{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:15px;
    }

    .stat{
      background:white;
      padding:15px;
      border-radius:12px;
      text-align:center;
      border:1px solid #dce5e9;
    }

    .stat-number{
      font-size:27px;
      font-weight:bold;
      color:#168c78;
    }

    .table-wrap{
      width:100%;
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      font-size:14px;
      min-width:760px;
    }

    th,
    td{
      padding:10px 7px;
      border-bottom:1px solid #e0e7ea;
      text-align:left;
      vertical-align:top;
    }

    th{
      background:#f5f8fa;
      white-space:nowrap;
    }

    td.reason{
      max-width:230px;
      word-break:break-word;
    }

    .empty-value{
      color:#8a989f;
    }

    .note{
      font-size:12px;
      color:#73838d;
      text-align:center;
      margin-top:15px;
    }

    @media(max-width:650px){

      body{
        padding:8px;
      }

      .status-grid{
        grid-template-columns:1fr;
      }

      .camera-grid{
        grid-template-columns:1fr;
      }

      .result-grid{
        grid-template-columns:1fr;
      }

      .card{
        padding:14px;
      }

      .header h1{
        font-size:22px;
      }

      table{
        font-size:12px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <span class="version">
      V7.4.1
    </span>

    <h1>
      QR ĐIỂM DANH HỌC SINH
    </h1>

    <p>
      Quét liên tục • Tự động ghi nhận • Camera không tắt sau mỗi lượt
    </p>

  </div>


  <div class="card">

    <label>
      Người điểm danh
    </label>

    <input
      id="teacher"
      type="text"
      placeholder="Nhập họ tên người điểm danh"
      autocomplete="name"
    >


    <label>
      Trạng thái
    </label>

    <div class="status-grid">

      <button
        class="status-btn active"
        onclick="selectStatus('Vào trường',this)"
      >
        VÀO TRƯỜNG
      </button>

      <button
        class="status-btn"
        onclick="selectStatus('Ra khỏi trường',this)"
      >
        RA KHỎI TRƯỜNG
      </button>

      <button
        class="status-btn"
        onclick="selectStatus('Vào học',this)"
      >
        VÀO HỌC
      </button>

    </div>


    <div id="studyOptions">

      <label>
        Kết quả vào học
      </label>

      <div class="result-grid">

        <button
          class="result-btn active"
          onclick="selectStudyResult('Vào lớp',this)"
        >
          VÀO LỚP
        </button>

        <button
          class="result-btn"
          onclick="selectStudyResult('Không vào lớp',this)"
        >
          KHÔNG VÀO LỚP
        </button>

      </div>


      <div id="reasonBox">

        <label>
          Lý do
        </label>

        <input
          id="reason"
          type="text"
          placeholder="Có thể để trống → hệ thống ghi Không lý do"
        >

      </div>

    </div>


    <label>
      Camera quét QR
    </label>

    <div id="reader"></div>


    <div class="camera-grid">

      <button
        class="btn btn-start"
        onclick="startScanner()"
      >
        BẬT CAMERA QUÉT LIÊN TỤC
      </button>

      <button
        class="btn btn-stop"
        onclick="stopScanner()"
      >
        TẮT CAMERA
      </button>

    </div>


    <div id="systemStatus">
      ● SẴN SÀNG
    </div>


    <div id="resultCard">

      <div id="studentName"></div>

      <div id="studentClass"></div>

      <div
        id="studentId"
        class="result-line"
      ></div>

      <div
        id="attendanceStatus"
        class="result-line"
      ></div>

      <div
        id="attendanceTime"
        class="result-line"
      ></div>

      <div
        id="attendanceNote"
        class="result-line"
      ></div>

    </div>


    <div class="stats">

      <div class="stat">

        <div
          id="successCount"
          class="stat-number"
        >
          0
        </div>

        <div>
          THÀNH CÔNG
        </div>

      </div>


      <div class="stat">

        <div
          id="duplicateCount"
          class="stat-number"
        >
          0
        </div>

        <div>
          QUÉT TRÙNG
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <h3>
      Lượt quét gần đây
    </h3>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              Thời gian
            </th>

            <th>
              Học sinh
            </th>

            <th>
              Lớp
            </th>

            <th>
              Trạng thái
            </th>

            <th>
              Kết quả
            </th>

            <th>
              Lý do
            </th>

          </tr>

        </thead>


        <tbody id="historyBody">
        </tbody>

      </table>

    </div>

  </div>


  <div class="note">
    V7.4.1 • GitHub Pages + Apps Script • Dữ liệu lưu vào sheet DiemDanh
  </div>

</div>


<script>

/* =========================================================
   CẤU HÌNH
========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyHnf5LzsV3nFw8vXVB2r-yxtOOCda7DADP82avkveTF8vLbO5SlKGWbXkhf14GdlUqmQ/exec';

const CALLBACK_NAME =
  'qrAttendanceCallback';

const API_TIMEOUT =
  15000;

const SAME_QR_LOCK =
  3000;


/* =========================================================
   BIẾN
========================================================= */

let scanner =
  null;

let scannerRunning =
  false;

let processing =
  false;

let selectedStatus =
  'Vào trường';

let selectedResult =
  'Vào lớp';

let lastQr =
  '';

let lastQrTime =
  0;

let successCount =
  0;

let duplicateCount =
  0;

let jsonpResolve =
  null;

let jsonpReject =
  null;

let jsonpTimer =
  null;


/* =========================================================
   JSONP CALLBACK
========================================================= */

window.qrAttendanceCallback =
  function(data){

    if(!jsonpResolve){
      return;
    }

    const resolve =
      jsonpResolve;

    clearJsonp();

    resolve(data);
  };


/* =========================================================
   CHỌN TRẠNG THÁI
========================================================= */

function selectStatus(
  status,
  button
){

  selectedStatus =
    status;


  document
    .querySelectorAll(
      '.status-btn'
    )
    .forEach(
      function(btn){

        btn.classList.remove(
          'active'
        );
      }
    );


  button.classList.add(
    'active'
  );


  const options =
    document.getElementById(
      'studyOptions'
    );


  if(
    status ===
    'Vào học'
  ){

    options.style.display =
      'block';

  }
  else{

    options.style.display =
      'none';
  }
}


/* =========================================================
   CHỌN KẾT QUẢ VÀO HỌC
========================================================= */

function selectStudyResult(
  result,
  button
){

  selectedResult =
    result;


  document
    .querySelectorAll(
      '.result-btn'
    )
    .forEach(
      function(btn){

        btn.classList.remove(
          'active'
        );
      }
    );


  button.classList.add(
    'active'
  );


  const reasonBox =
    document.getElementById(
      'reasonBox'
    );


  if(
    result ===
    'Không vào lớp'
  ){

    reasonBox.style.display =
      'block';

  }
  else{

    reasonBox.style.display =
      'none';
  }
}


/* =========================================================
   BẬT CAMERA
========================================================= */

async function startScanner(){

  if(scannerRunning){
    return;
  }


  const teacher =
    getTeacher();


  if(!teacher){

    alert(
      'Vui lòng nhập người điểm danh trước khi bật camera.'
    );


    document
      .getElementById(
        'teacher'
      )
      .focus();


    return;
  }


  localStorage.setItem(
    'qr_teacher',
    teacher
  );


  setSystemStatus(
    '● ĐANG MỞ CAMERA...'
  );


  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {
        fps:
          10,

        aspectRatio:
          1.333333,

        qrbox:
          function(
            width,
            height
          ){

            const size =
              Math.floor(
                Math.min(
                  width,
                  height
                ) * 0.70
              );


            return{
              width:size,
              height:size
            };
          }
      },

      onQrRead,

      function(){
        // Frame hiện tại chưa có QR.
      }
    );


    scannerRunning =
      true;


    setSystemStatus(
      '● CAMERA ĐANG QUÉT — ĐƯA QR HỌC SINH VÀO KHUNG'
    );

  }
  catch(error){

    scannerRunning =
      false;


    setSystemStatus(
      '✕ KHÔNG MỞ ĐƯỢC CAMERA: ' +
      errorMessage(error)
    );
  }
}


/* =========================================================
   ĐỌC QR
========================================================= */

async function onQrRead(
  decodedText
){

  const qr =
    normalizeQr(
      decodedText
    );


  if(
    !/^HS-[A-Z0-9]+$/.test(
      qr
    )
  ){

    return;
  }


  if(processing){
    return;
  }


  const now =
    Date.now();


  if(
    qr === lastQr &&
    now - lastQrTime <
      SAME_QR_LOCK
  ){

    return;
  }


  const teacher =
    getTeacher();


  if(!teacher){

    setSystemStatus(
      '⚠ CHƯA NHẬP NGƯỜI ĐIỂM DANH'
    );

    beepError();

    return;
  }


  lastQr =
    qr;

  lastQrTime =
    now;

  processing =
    true;


  setSystemStatus(
    '⏳ ĐÃ ĐỌC QR — ĐANG GHI ĐIỂM DANH...'
  );


  let result =
    '';

  let reason =
    '';


  if(
    selectedStatus ===
    'Vào học'
  ){

    result =
      selectedResult;


    if(
      selectedResult ===
      'Không vào lớp'
    ){

      reason =
        document
          .getElementById(
            'reason'
          )
          .value
          .trim();
    }
  }


  try{

    const data =
      await saveAttendanceJsonp(
        qr,
        teacher,
        selectedStatus,
        result,
        reason
      );


    handleAttendanceResult(
      data,
      qr
    );

  }
  catch(error){

    showError(
      'Không kết nối được Apps Script',
      qr
    );


    setSystemStatus(
      '✕ LỖI KẾT NỐI: ' +
      errorMessage(error)
    );


    beepError();

  }
  finally{

    processing =
      false;
  }
}


/* =========================================================
   GỌI API GHI ĐIỂM DANH
========================================================= */

function saveAttendanceJsonp(
  qr,
  teacher,
  status,
  result,
  reason
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      clearJsonp();


      jsonpResolve =
        resolve;

      jsonpReject =
        reject;


      const script =
        document.createElement(
          'script'
        );


      script.id =
        'jsonp-attendance';


      script.onerror =
        function(){

          const rejectNow =
            jsonpReject;


          clearJsonp();


          if(rejectNow){

            rejectNow(
              new Error(
                'Không tải được API Apps Script'
              )
            );
          }
        };


      script.src =
        API_URL +
        '?page=api-v7-save' +

        '&qr=' +
        encodeURIComponent(
          qr
        ) +

        '&teacher=' +
        encodeURIComponent(
          teacher
        ) +

        '&status=' +
        encodeURIComponent(
          status
        ) +

        '&result=' +
        encodeURIComponent(
          result
        ) +

        '&reason=' +
        encodeURIComponent(
          reason
        ) +

        '&callback=' +
        CALLBACK_NAME +

        '&t=' +
        Date.now();


      jsonpTimer =
        setTimeout(
          function(){

            const rejectNow =
              jsonpReject;


            clearJsonp();


            if(rejectNow){

              rejectNow(
                new Error(
                  'Apps Script không phản hồi sau 15 giây'
                )
              );
            }
          },
          API_TIMEOUT
        );


      document.body.appendChild(
        script
      );
    }
  );
}


/* =========================================================
   XỬ LÝ KẾT QUẢ
========================================================= */

function handleAttendanceResult(
  data,
  qr
){

  if(
    data &&
    data.success
  ){

    successCount++;


    updateCounters();


    showSuccess(
      data
    );


    addHistory(
      data
    );


    setSystemStatus(
      '✓ ĐÃ GHI ĐIỂM DANH — CAMERA TIẾP TỤC QUÉT'
    );


    beepSuccess();


    return;
  }


  if(
    data &&
    data.duplicate
  ){

    duplicateCount++;


    updateCounters();


    showDuplicate(
      data
    );


    setSystemStatus(
      '⚠ QUÉT TRÙNG — KHÔNG GHI THÊM DỮ LIỆU'
    );


    beepDuplicate();


    return;
  }


  const message =
    data &&
    data.message
      ? data.message
      : 'Không thể ghi điểm danh';


  showError(
    message,
    qr
  );


  setSystemStatus(
    '✕ ' +
    message
  );


  beepError();
}


/* =========================================================
   HIỂN THỊ THÀNH CÔNG
========================================================= */

function showSuccess(
  data
){

  const card =
    document.getElementById(
      'resultCard'
    );


  card.className =
    'success';


  document.getElementById(
    'studentName'
  ).textContent =
    data.hoTen ||
    '';


  document.getElementById(
    'studentClass'
  ).textContent =
    data.lop
      ? 'LỚP ' +
        data.lop
      : '';


  document.getElementById(
    'studentId'
  ).textContent =
    'Mã HS: ' +
    (
      data.maHS ||
      ''
    );


  document.getElementById(
    'attendanceStatus'
  ).textContent =
    'Trạng thái: ' +
    (
      data.trangThai ||
      ''
    );


  document.getElementById(
    'attendanceTime'
  ).textContent =
    'Thời gian: ' +
    (
      data.thoiGian ||
      ''
    );


  let note =
    '';


  if(
    data.ketQua
  ){

    note =
      data.ketQua;
  }


  if(
    data.ghiChu
  ){

    if(note){

      note +=
        ' — ';
    }


    note +=
      data.ghiChu;
  }


  document.getElementById(
    'attendanceNote'
  ).textContent =
    note;
}


/* =========================================================
   HIỂN THỊ TRÙNG
========================================================= */

function showDuplicate(
  data
){

  const card =
    document.getElementById(
      'resultCard'
    );


  card.className =
    'error';


  document.getElementById(
    'studentName'
  ).textContent =
    data.hoTen ||
    'QUÉT TRÙNG';


  document.getElementById(
    'studentClass'
  ).textContent =
    data.lop
      ? 'LỚP ' +
        data.lop
      : '';


  document.getElementById(
    'studentId'
  ).textContent =
    data.maHS
      ? 'Mã HS: ' +
        data.maHS
      : '';


  document.getElementById(
    'attendanceStatus'
  ).textContent =
    'QR vừa được ghi nhận';


  document.getElementById(
    'attendanceTime'
  ).textContent =
    'Không tạo dòng mới';


  document.getElementById(
    'attendanceNote'
  ).textContent =
    '';
}


/* =========================================================
   HIỂN THỊ LỖI
========================================================= */

function showError(
  message,
  qr
){

  const card =
    document.getElementById(
      'resultCard'
    );


  card.className =
    'error';


  document.getElementById(
    'studentName'
  ).textContent =
    'KHÔNG GHI NHẬN';


  document.getElementById(
    'studentClass'
  ).textContent =
    message ||
    '';


  document.getElementById(
    'studentId'
  ).textContent =
    qr ||
    '';


  document.getElementById(
    'attendanceStatus'
  ).textContent =
    '';


  document.getElementById(
    'attendanceTime'
  ).textContent =
    '';


  document.getElementById(
    'attendanceNote'
  ).textContent =
    '';
}


/* =========================================================
   LỊCH SỬ QUÉT

   V7.4.1:
   TÁCH RIÊNG KẾT QUẢ VÀ LÝ DO.
========================================================= */

function addHistory(
  data
){

  const body =
    document.getElementById(
      'historyBody'
    );


  const row =
    document.createElement(
      'tr'
    );


  /*
   * Kết quả:
   * - Vào lớp
   * - Không vào lớp
   * - Nếu Vào trường/Ra khỏi trường -> —
   */
  const ketQua =
    data.ketQua
      ? data.ketQua
      : '—';


  /*
   * Lý do:
   * Backend đã tự đổi lý do trống thành
   * "Không lý do" khi Không vào lớp.
   *
   * Các trường hợp không có ghi chú -> —
   */
  const lyDo =
    data.ghiChu
      ? data.ghiChu
      : '—';


  const values = [

    data.thoiGian ||
    '',

    data.hoTen ||
    '',

    data.lop ||
    '',

    data.trangThai ||
    '',

    ketQua,

    lyDo

  ];


  values.forEach(
    function(
      value,
      index
    ){

      const td =
        document.createElement(
          'td'
        );


      td.textContent =
        value;


      /*
       * Cột thứ 6 là Lý do.
       */
      if(
        index === 5
      ){

        td.classList.add(
          'reason'
        );
      }


      /*
       * Làm nhẹ ký hiệu —
       */
      if(
        value === '—'
      ){

        td.classList.add(
          'empty-value'
        );
      }


      row.appendChild(
        td
      );
    }
  );


  body.insertBefore(
    row,
    body.firstChild
  );


  /*
   * Giữ tối đa 20 lượt
   * trong phiên làm việc.
   */
  while(
    body.children.length >
    20
  ){

    body.removeChild(
      body.lastChild
    );
  }
}


/* =========================================================
   TẮT CAMERA
========================================================= */

async function stopScanner(){

  if(
    !scanner ||
    !scannerRunning
  ){

    setSystemStatus(
      '● CAMERA ĐÃ TẮT'
    );


    return;
  }


  try{

    await scanner.stop();


    scanner.clear();

  }
  catch(error){

    console.warn(
      error
    );
  }


  scannerRunning =
    false;

  processing =
    false;


  clearJsonp();


  setSystemStatus(
    '● CAMERA ĐÃ TẮT'
  );
}


/* =========================================================
   XÓA JSONP
========================================================= */

function clearJsonp(){

  if(
    jsonpTimer
  ){

    clearTimeout(
      jsonpTimer
    );


    jsonpTimer =
      null;
  }


  const oldScript =
    document.getElementById(
      'jsonp-attendance'
    );


  if(
    oldScript
  ){

    oldScript.remove();
  }


  jsonpResolve =
    null;

  jsonpReject =
    null;
}

/* =========================================================
   CHUẨN HÓA QR
========================================================= */

function normalizeQr(
  value
){

  return String(
    value ||
    ''
  )
  .replace(
    /\u0000/g,
    ''
  )
  .replace(
    /\r/g,
    ''
  )
  .replace(
    /\n/g,
    ''
  )
  .trim()
  .toUpperCase();
}


/* =========================================================
   TRẠNG THÁI HỆ THỐNG
========================================================= */

function setSystemStatus(
  text
){

  document.getElementById(
    'systemStatus'
  ).textContent =
    text;
}


/* =========================================================
   ÂM THANH
========================================================= */

function beepSuccess(){

  beep(
    1050,
    120
  );
}


function beepDuplicate(){

  beep(
    650,
    180
  );
}


function beepError(){

  beep(
    350,
    300
  );
}


function beep(
  frequency,
  duration
){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.frequency.value =
      frequency;


    oscillator.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    gain.gain.value =
      0.12;


    oscillator.start();


    setTimeout(
      function(){

        oscillator.stop();

        ctx.close();

      },
      duration
    );

  }
  catch(error){
    // Âm thanh không ảnh hưởng chức năng.
  }
}


/* =========================================================
   LỖI
========================================================= */

function errorMessage(
  error
){

  if(
    !error
  ){

    return 'Không xác định';
  }


  return (
    error.message ||
    String(error)
  );
}
